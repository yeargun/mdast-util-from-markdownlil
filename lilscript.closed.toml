# closed LilScript world. This compiler renames no properties, so extern class keys
# keep their names here too; the lane differs from lilscript.toml in its optimizer settings.
[javascript]
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = false
